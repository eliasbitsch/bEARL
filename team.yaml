# Optional extra systems (e.g. the RGB-only deep dive). Same fields, plus "owner".
extras:
  # RGB-only deep dive 1: same VGGT-Long pipeline with the metric foundation model MapAnything.
  - owner: Elias Bitsch
    slug: map_long
    system: Map-Long (VGGT-Long + MapAnything)
    paper: keetha2025mapanything
    sensors: [rgb]
    alignment: se3
    loop_closure: true
    hardware: ADA cluster, 48 GB MIG slice of an RTX PRO 6000 Blackwell

  # Same as map_long, but MapAnything gets the real D435i intrinsics.
  - owner: Elias Bitsch
    slug: map_long_calib
    system: Map-Long calibrated (VGGT-Long + MapAnything + intrinsics)
    paper: keetha2025mapanything
    sensors: [rgb]
    alignment: se3
    loop_closure: true
    hardware: ADA cluster, 48 GB MIG slice of an RTX PRO 6000 Blackwell

  # Diagnostic: map_long with Sim(3) chunk alignment (deviation from upstream).
  - owner: Elias Bitsch
    slug: map_long_sim3
    system: Map-Long Sim(3) (diagnostic)
    paper: keetha2025mapanything
    sensors: [rgb]
    alignment: sim3
    loop_closure: true
    hardware: ADA cluster, 48 GB MIG slice of an RTX PRO 6000 Blackwell

  # RGB-only deep dive 2: foundation model on image pairs.
  - owner: Elias Bitsch
    slug: mast3r_slam
    system: MASt3R-SLAM
    paper: murai2025mast3rslam
    sensors: [rgb]
    alignment: sim3
    loop_closure: true
    hardware: RTX 3080 Ti Laptop (16 GB) / H200 GPU cluster
