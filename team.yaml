# Single source of truth for who evaluates which SLAM system.
#
# To register your system, run (from the repo root):
#   python tools/register_system.py --member "Your Name" --system "System Name" --slug system_name
# This fills in your entry below and creates config/systems/<slug>.yaml and
# pipeline/runners/<slug>.py from the templates. Then complete the TODOs in those two files.
#
# Fields:
#   slug        short lowercase id, used for folder names (results/<slug>/...)
#   system      official name of the SLAM system
#   paper       BibTeX key of the system's paper in docs/references.bib
#   sensors     subset of: lidar3d, imu, wheel_odom, rgb, depth
#   alignment   se3 for metric systems, sim3 for monocular (scale-ambiguous) systems
#   loop_closure true / false
#   hardware    the machine the runs were done on (filled in automatically per run as well)

members:
  - name: Elias Bitsch
    slug: vggt_long
    system: VGGT-Long
    paper: deng2026vggtlong
    sensors: [rgb]
    alignment: sim3
    loop_closure: true
    hardware: RTX 3080 Ti Laptop (16 GB) / H200 GPU cluster

